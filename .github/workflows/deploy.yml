name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy → Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Write SSH key to file ───────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle.pem
          chmod 600 ~/.ssh/oracle.pem
          # Disable strict host checking so first-time connect doesn't hang
          cat >> ~/.ssh/config <<EOF
          Host oracle-vm
            HostName ${{ secrets.ORACLE_HOST }}
            User ${{ secrets.ORACLE_USER }}
            IdentityFile ~/.ssh/oracle.pem
            StrictHostKeyChecking no
            ConnectTimeout 30
          EOF

      # ── 2. Verify SSH connection ───────────────────────────────────────
      - name: Verify SSH connection
        run: ssh oracle-vm "echo 'SSH OK — hostname:' && hostname"

      # ── 3. Bootstrap VM if first deploy ───────────────────────────────
      - name: Bootstrap VM (if needed)
        run: |
          ssh oracle-vm bash <<'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/trading-agent

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "=== First deploy: bootstrapping VM ==="
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3.12 python3.12-venv python3.12-dev git libpq-dev build-essential
            git clone https://github.com/Somacharan5/Algotradesoma.git "$APP_DIR"
            python3.12 -m venv "$APP_DIR/.venv"
            "$APP_DIR/.venv/bin/pip" install --upgrade pip -q
            "$APP_DIR/.venv/bin/pip" install -r "$APP_DIR/requirements.txt" -q
            mkdir -p "$APP_DIR/logs"
            sudo cp "$APP_DIR/deploy/trading-agent.service" /etc/systemd/system/trading-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable trading-agent
            sudo cp "$APP_DIR/deploy/logrotate.conf" /etc/logrotate.d/trading-agent
            echo "=== Bootstrap complete ==="
            echo "ACTION NEEDED: copy your .env to $APP_DIR/.env then re-run this workflow"
          else
            echo "=== VM already bootstrapped ==="
          fi
          ENDSSH

      # ── 4. Deploy: pull + install + restart ───────────────────────────
      - name: Deploy latest code
        run: |
          ssh oracle-vm bash <<'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/trading-agent
          VENV=$APP_DIR/.venv

          echo "=== Pull latest code ==="
          cd $APP_DIR && git pull origin main

          echo "=== Update dependencies ==="
          $VENV/bin/pip install -r requirements.txt -q

          # Only restart if .env exists (credentials have been set)
          if [ ! -f "$APP_DIR/.env" ]; then
            echo "WARNING: .env not found — skipping service start"
            echo "Copy your .env to $APP_DIR/.env and re-run this workflow"
            exit 0
          fi

          echo "=== Restart service ==="
          sudo systemctl restart trading-agent
          sleep 6
          systemctl is-active trading-agent && echo "=== Service is UP ===" || (echo "=== Service FAILED ==="; journalctl -u trading-agent --no-pager -n 20; exit 1)
          ENDSSH

      # ── 5. Notify result ───────────────────────────────────────────────
      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>Deploy successful</b>%0ACommit: <code>${{ github.sha }}</code>"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Deploy FAILED</b>%0ACommit: <code>${{ github.sha }}</code>%0ASee: https://github.com/Somacharan5/Algotradesoma/actions"
