name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: SSH deploy → Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout (just for reference; VM pulls directly from git) ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Deploy via SSH ─────────────────────────────────────────────
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.ORACLE_HOST }}
          username:    ${{ secrets.ORACLE_USER }}
          key:         ${{ secrets.ORACLE_SSH_KEY }}
          port:        22
          timeout:     300s
          script: |
            set -euo pipefail
            APP_DIR=/home/ubuntu/trading-agent
            VENV=$APP_DIR/.venv

            echo "=== Pull latest code ==="
            cd $APP_DIR
            git pull origin main

            echo "=== Install/update dependencies ==="
            $VENV/bin/pip install -r requirements.txt -q

            echo "=== Restart service ==="
            sudo systemctl restart trading-agent

            echo "=== Verify running ==="
            sleep 5
            systemctl is-active trading-agent && echo "Service is UP" || (echo "Service FAILED"; exit 1)

            echo "=== Deploy complete ==="

      # ── 3. Notify on failure ──────────────────────────────────────────
      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Deploy FAILED</b>%0ACommit: <code>${{ github.sha }}</code>%0ACheck GitHub Actions for details."
