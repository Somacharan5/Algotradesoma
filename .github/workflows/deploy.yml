name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy → Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VM_HOST: ${{ secrets.ORACLE_HOST }}
      VM_USER: ${{ secrets.ORACLE_USER }}
      VM_KEY:  ${{ secrets.ORACLE_SSH_KEY }}
      SSH:     "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o BatchMode=yes -i ~/.ssh/oracle.pem"

    steps:
      # ── 1. Validate secrets are set ────────────────────────────────────
      - name: Validate secrets
        run: |
          missing=()
          [ -z "$VM_HOST" ] && missing+=("ORACLE_HOST")
          [ -z "$VM_USER" ] && missing+=("ORACLE_USER")
          [ -z "$VM_KEY"  ] && missing+=("ORACLE_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing GitHub secrets: ${missing[*]}"
            echo "Go to: https://github.com/Somacharan5/Algotradesoma/settings/secrets/actions"
            exit 1
          fi
          echo "All secrets present: VM_HOST=$VM_HOST  VM_USER=$VM_USER"

      # ── 2. Write SSH key ───────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/oracle.pem
          chmod 600 ~/.ssh/oracle.pem

      # ── 3. Verify SSH connection ───────────────────────────────────────
      - name: Verify SSH connection
        run: |
          $SSH $VM_USER@$VM_HOST "echo 'SSH OK — hostname:' && hostname"

      # ── 4. Bootstrap VM on first deploy ───────────────────────────────
      - name: Bootstrap VM (if needed)
        run: |
          $SSH $VM_USER@$VM_HOST << 'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/trading-agent

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "=== First deploy: bootstrapping VM ==="
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3.12 python3.12-venv python3.12-dev git libpq-dev build-essential
            git clone https://github.com/Somacharan5/Algotradesoma.git "$APP_DIR"
            python3.12 -m venv "$APP_DIR/.venv"
            "$APP_DIR/.venv/bin/pip" install --upgrade pip -q
            "$APP_DIR/.venv/bin/pip" install -r "$APP_DIR/requirements.txt" -q
            mkdir -p "$APP_DIR/logs"
            sudo cp "$APP_DIR/deploy/trading-agent.service" /etc/systemd/system/trading-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable trading-agent
            sudo cp "$APP_DIR/deploy/logrotate.conf" /etc/logrotate.d/trading-agent
            echo "=== Bootstrap complete ==="
          else
            echo "=== VM already bootstrapped ==="
          fi
          ENDSSH

      # ── 5. Pull + install + restart ────────────────────────────────────
      - name: Deploy latest code
        run: |
          $SSH $VM_USER@$VM_HOST << 'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/trading-agent
          VENV=$APP_DIR/.venv

          echo "=== Pull latest code ==="
          cd $APP_DIR && git pull origin main

          echo "=== Update dependencies ==="
          $VENV/bin/pip install -r requirements.txt -q

          if [ ! -f "$APP_DIR/.env" ]; then
            echo ""
            echo "=========================================="
            echo "  ACTION NEEDED: .env not found on VM"
            echo "  SSH in and run:"
            echo "    nano $APP_DIR/.env"
            echo "  Then re-run this workflow."
            echo "=========================================="
            exit 0
          fi

          echo "=== Restart service ==="
          sudo systemctl restart trading-agent
          sleep 6
          if systemctl is-active --quiet trading-agent; then
            echo "=== Service is UP ==="
          else
            echo "=== Service FAILED — last 30 log lines ==="
            journalctl -u trading-agent --no-pager -n 30
            exit 1
          fi
          ENDSSH

      # ── 6. Notify result ───────────────────────────────────────────────
      - name: Notify success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=✅ Deploy successful — commit ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ Deploy FAILED — commit ${{ github.sha }} — https://github.com/Somacharan5/Algotradesoma/actions"
