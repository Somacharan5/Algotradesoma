name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy → Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VM_HOST: ${{ secrets.ORACLE_HOST }}
      VM_USER: ${{ secrets.ORACLE_USER }}
      VM_KEY:  ${{ secrets.ORACLE_SSH_KEY }}
      SSH:     "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o BatchMode=yes -i ~/.ssh/oracle.pem"
      APP_DIR: /home/ubuntu/trading-agent

    steps:
      # ── 1. Validate secrets are set ────────────────────────────────────
      - name: Validate secrets
        run: |
          missing=()
          [ -z "$VM_HOST" ] && missing+=("ORACLE_HOST")
          [ -z "$VM_USER" ] && missing+=("ORACLE_USER")
          [ -z "$VM_KEY"  ] && missing+=("ORACLE_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing GitHub secrets: ${missing[*]}"
            echo "Go to: https://github.com/Somacharan5/Algotradesoma/settings/secrets/actions"
            exit 1
          fi
          case "$VM_HOST" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*)
              echo "ERROR: ORACLE_HOST is a PRIVATE IP ($VM_HOST) — GitHub cannot reach it."
              echo "Set it to the VM's PUBLIC IP (Oracle console → Compute → Instances)."
              exit 1
              ;;
          esac
          echo "Secrets present: VM_HOST=$VM_HOST  VM_USER=$VM_USER"

      # ── 2. Check out code ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 3. Write SSH key ───────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/oracle.pem
          chmod 600 ~/.ssh/oracle.pem

      # ── 4. Verify SSH connection ───────────────────────────────────────
      - name: Verify SSH connection
        run: |
          $SSH $VM_USER@$VM_HOST "echo 'SSH OK — hostname:' && hostname"

      # ── 5. Sync code to VM ────────────────────────────────────────────
      # The repo is private, so the VM never talks to GitHub: the runner
      # checks the code out and rsyncs it over. .env, logs and data on
      # the VM are left untouched.
      - name: Sync code
        run: |
          $SSH $VM_USER@$VM_HOST "mkdir -p $APP_DIR; command -v rsync >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq rsync)"
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i ~/.ssh/oracle.pem" \
            --exclude '.git' --exclude '.env' --exclude '.venv' \
            --exclude 'logs/' --exclude 'data/' --exclude '__pycache__' \
            ./ $VM_USER@$VM_HOST:$APP_DIR/

      # ── 6. Install + restart ───────────────────────────────────────────
      - name: Install and restart service
        run: |
          $SSH $VM_USER@$VM_HOST << 'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/trading-agent
          VENV=$APP_DIR/.venv

          if ! dpkg -s python3-venv >/dev/null 2>&1; then
            echo "=== First deploy: installing system packages ==="
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-venv python3-dev libpq-dev build-essential
          fi

          if [ ! -d "$VENV" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip -q
          fi

          echo "=== Update dependencies ==="
          "$VENV/bin/pip" install -r "$APP_DIR/requirements.txt" -q
          "$VENV/bin/pip" install -r "$APP_DIR/dashboard/requirements.txt" -q
          mkdir -p "$APP_DIR/logs" "$APP_DIR/data"

          sudo cp "$APP_DIR/deploy/trading-agent.service" /etc/systemd/system/trading-agent.service
          sudo cp "$APP_DIR/deploy/trading-dashboard.service" /etc/systemd/system/trading-dashboard.service
          sudo cp "$APP_DIR/deploy/logrotate.conf" /etc/logrotate.d/trading-agent
          sudo systemctl daemon-reload
          sudo systemctl enable trading-agent trading-dashboard

          echo "=== Ensure health-check watchdog cron is installed ==="
          CRON_LINE="*/5 * * * * $VENV/bin/python $APP_DIR/scripts/health_check.py >> $APP_DIR/logs/health.log 2>&1"
          { crontab -l 2>/dev/null | grep -v 'scripts/health_check.py' || true; echo "$CRON_LINE"; } | crontab -

          if [ ! -f "$APP_DIR/.env" ]; then
            echo ""
            echo "=========================================="
            echo "  ACTION NEEDED: .env not found on VM"
            echo "  SSH in and run:"
            echo "    nano $APP_DIR/.env"
            echo "  Then re-run this workflow."
            echo "=========================================="
            exit 0
          fi

          echo "=== Restart services ==="
          sudo systemctl restart trading-agent
          sudo systemctl restart trading-dashboard
          sleep 6
          if ! systemctl is-active --quiet trading-dashboard; then
            echo "=== Dashboard FAILED — last 20 log lines ==="
            journalctl -u trading-dashboard --no-pager -n 20
          fi
          if systemctl is-active --quiet trading-agent; then
            echo "=== Service is UP ==="
          else
            echo "=== Service FAILED — last 30 log lines ==="
            journalctl -u trading-agent --no-pager -n 30
            exit 1
          fi
          ENDSSH

      # ── 7. Notify result ───────────────────────────────────────────────
      - name: Notify success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=✅ Deploy successful — commit ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ Deploy FAILED — commit ${{ github.sha }} — https://github.com/Somacharan5/Algotradesoma/actions"
