name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SSH_OPTS: -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o BatchMode=yes

jobs:
  deploy:
    name: SSH deploy → Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Write SSH key ───────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle.pem
          chmod 600 ~/.ssh/oracle.pem

      # ── 2. Verify SSH connection ───────────────────────────────────────
      - name: Verify SSH connection
        run: |
          ssh $SSH_OPTS -i ~/.ssh/oracle.pem \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "echo 'SSH OK — hostname:' && hostname"

      # ── 3. Bootstrap VM on first deploy ───────────────────────────────
      - name: Bootstrap VM (if needed)
        run: |
          ssh $SSH_OPTS -i ~/.ssh/oracle.pem \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/trading-agent

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "=== First deploy: bootstrapping VM ==="
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3.12 python3.12-venv python3.12-dev git libpq-dev build-essential
            git clone https://github.com/Somacharan5/Algotradesoma.git "$APP_DIR"
            python3.12 -m venv "$APP_DIR/.venv"
            "$APP_DIR/.venv/bin/pip" install --upgrade pip -q
            "$APP_DIR/.venv/bin/pip" install -r "$APP_DIR/requirements.txt" -q
            mkdir -p "$APP_DIR/logs"
            sudo cp "$APP_DIR/deploy/trading-agent.service" /etc/systemd/system/trading-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable trading-agent
            sudo cp "$APP_DIR/deploy/logrotate.conf" /etc/logrotate.d/trading-agent
            echo "=== Bootstrap complete ==="
          else
            echo "=== VM already bootstrapped — skipping ==="
          fi
          ENDSSH

      # ── 4. Pull + install + restart ────────────────────────────────────
      - name: Deploy latest code
        run: |
          ssh $SSH_OPTS -i ~/.ssh/oracle.pem \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/trading-agent
          VENV=$APP_DIR/.venv

          echo "=== Pull latest code ==="
          cd $APP_DIR && git pull origin main

          echo "=== Update dependencies ==="
          $VENV/bin/pip install -r requirements.txt -q

          if [ ! -f "$APP_DIR/.env" ]; then
            echo "WARNING: $APP_DIR/.env not found — skipping service start"
            echo "SSH into VM and run: nano $APP_DIR/.env"
            exit 0
          fi

          echo "=== Restart service ==="
          sudo systemctl restart trading-agent
          sleep 6
          if systemctl is-active --quiet trading-agent; then
            echo "=== Service is UP ==="
          else
            echo "=== Service FAILED — last 20 log lines ==="
            journalctl -u trading-agent --no-pager -n 20
            exit 1
          fi
          ENDSSH

      # ── 5. Notify result ───────────────────────────────────────────────
      - name: Notify success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>Deploy successful</b>%0ACommit: <code>${{ github.sha }}</code>"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Deploy FAILED</b>%0ACommit: <code>${{ github.sha }}</code>%0ASee: https://github.com/Somacharan5/Algotradesoma/actions"
